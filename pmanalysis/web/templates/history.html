{% extends "base.html" %}
{% block title %}History — Polymarket Analysis{% endblock %}
{% block body %}
<header class="topbar">
  <div class="topbar-left"><div class="brand">Polymarket Analysis</div></div>
  <nav class="topbar-nav">
    <a href="/">Dashboard</a>
    <a href="/history" class="active">History</a>
    <a href="/status">Status</a>
  </nav>
</header>
<div class="page-container">
  <h1>Window History</h1>
  <div class="filters">
    <select id="filter-asset">
      <option value="">All assets</option>
      <option>BTC</option><option>ETH</option><option>SOL</option>
    </select>
    <select id="filter-interval">
      <option value="">All intervals</option>
      <option>5m</option><option>15m</option>
    </select>
  </div>
  <table class="data-table" id="history-table">
    <thead>
      <tr><th>Slug</th><th>Asset</th><th>Interval</th><th>End</th><th>Strike</th><th>Outcome</th><th>Ticks</th><th>Export</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="chart-panel" style="margin-top:1rem">
    <div class="chart-head"><span>Replay</span></div>
    <div id="replay-oracle" class="chart-box"></div>
    <div id="replay-prob" class="chart-box chart-box-sm"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/lib/format.js"></script>
<script src="/static/js/lib/charts.js"></script>
<script src="/static/js/history.js"></script>
{% endblock %}
